schema {
  query: Query
  mutation: Mutation
}

type Query {
  getAlbum(id: String!): Album
  getAlbumsByArtist(artist: String!): [Album!]!
  listAllAlbums: [Album!]!
  sayHello(name: String): String
  sayGoodbye(name: String): String
}

type Mutation {
  addAlbum(artist: String!, title: String!, mediaType: MediaType!, condition: String, musicBrainzId: String): Album!
  updateAlbum(id: String!, artist: String!, title: String!, mediaType: MediaType!, condition: String, musicBrainzId: String): Album!
  deleteAlbum(id: String!): Boolean!
  "Looks the cover up again. Pass musicBrainzId (a release group ID) to fix a wrong match."
  refreshCoverArt(id: String!, musicBrainzId: String): Album!
}

type Album {
  id: String!
  artist: String!
  title: String!
  mediaType: MediaType!
  condition: String
  username: String
  "MusicBrainz release group ID the cover was matched to."
  musicBrainzId: String
  "Front cover (500px) from the Cover Art Archive."
  coverArtUrl: String
}

enum MediaType {
  LP
  CD
  CASSETTE
  OTHER
  BOX_SET
}
