name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-2
  STACK_NAME: music-catalogue-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Load each built Lambda the way the Lambda runtime does (no ES module detection),
      # so a handler that would crash with "Unexpected token 'export'" fails here instead.
      - name: Check Lambda handlers load
        run: |
          for fn in greeter coverart; do
            node --no-experimental-detect-module -e "
              import('./dist/$fn/app.js').then(m => {
                if (typeof (m.lambdaHandler ?? m.default?.lambdaHandler) !== 'function') throw new Error('no lambdaHandler');
                console.log('$fn: ok');
              })"
          done

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Never run two deploys of the stack at once; a newer merge waits for the current one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write # lets the job request an OIDC token to assume the AWS role
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: npm ci
      # sam build only copies ./dist, so the TypeScript must be compiled first.
      - run: npm run build
      - run: sam build
      - run: >-
          sam deploy
          --stack-name "$STACK_NAME"
          --region "$AWS_REGION"
          --resolve-s3
          --capabilities CAPABILITY_IAM
          --no-confirm-changeset
          --no-fail-on-empty-changeset

      - name: Show API endpoint
        run: >-
          aws cloudformation describe-stacks
          --stack-name "$STACK_NAME"
          --query "Stacks[0].Outputs[?OutputKey=='MusicCatalogueGraphQLApi'].OutputValue"
          --output text
